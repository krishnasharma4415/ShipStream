services:
  # Auth Service
  - type: web
    name: shipstream-auth
    env: node
    region: oregon
    plan: free
    buildCommand: cd server/auth-service && npm install && npm run build
    startCommand: cd server/auth-service && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_SERVICE_PORT
        value: 5501
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_REDIRECT_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

  # Upload Service
  - type: web
    name: shipstream-upload
    env: node
    region: oregon
    plan: free
    buildCommand: cd server/upload-service && npm install && npm run build
    startCommand: cd server/upload-service && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPLOAD_SERVICE_PORT
        value: 5500
      - key: AUTH_SERVICE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: REDIS_URL
        sync: false

  # Deploy Service
  - type: web
    name: shipstream-deploy
    env: node
    region: oregon
    plan: free
    buildCommand: cd server/deploy-service && npm install && npm run build
    startCommand: cd server/deploy-service && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEPLOY_SERVICE_PORT
        value: 5502
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: REDIS_URL
        sync: false

  # Request Handler
  - type: web
    name: shipstream-handler
    env: node
    region: oregon
    plan: free
    buildCommand: cd server/request-handler && npm install && npm run build
    startCommand: cd server/request-handler && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: REQUEST_HANDLER_PORT
        value: 3000
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
